[package]
name = "counter_retained"
version = "0.1.0"
edition = "2024"
default-run = "counter_retained"

[[bin]]
name = "counter_retained"
path = "main.rs"

[lib]
name = "counter_android"
path = "counter_android.rs"
crate-type = ["cdylib"]

[dependencies]
util = { path = "../util" }

[dependencies.retgui_retained]
path = "../../crates/retgui_retained"
default-features = false
features = ["system_fonts", "vello_hybrid_renderer"]
