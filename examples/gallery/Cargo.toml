[package]
name = "gallery"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gallery"
path = "main.rs"

[features]
audio = ["retgui_retained/audio"]
default = ["audio"]

[dependencies]
util = { path = "../util" }

[dependencies.retgui_retained]
path = "../../crates/retgui_retained"
default-features = false
features = [
    "system_fonts",
    "http_client",
    "jpeg",
    "png",
    "clipboard",
    "vello_hybrid_renderer"
]
