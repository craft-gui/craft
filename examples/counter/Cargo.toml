[package]
name = "counter"
version = "0.1.0"
edition = "2024"
default-run = "counter"

[[bin]]
name = "counter"
path = "main.rs"

[lib]
name = "counter_android"
path = "counter_android.rs"
crate-type = ["cdylib"]

[dependencies]
util = { path = "../util" }

[dependencies.retgui]
path = "../../crates/retgui"
default-features = false
features = ["system_fonts", "vello_hybrid_renderer"]
