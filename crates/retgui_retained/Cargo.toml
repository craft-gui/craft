[package]
name = "retgui_retained"
description = "Core library for the RetGui GUI framework."
version = "0.1.1"
edition = "2024"
resolver = "2"
license-file = "LICENSE"
homepage = "https://retguigui.com/"
repository = "https://github.com/RetGui/retgui"

[features]
audio = ["dep:maudio", "dep:windows"]
dynamic_linking = []
clipboard = ["dep:clipboard-rs"]
vello_cpu_renderer = ["retgui_renderer/vello_cpu_renderer"]
vello_hybrid_renderer = ["retgui_renderer/vello_hybrid_renderer"]
http_client = ["retgui_resource_manager/http_client"]

system_fonts = ["parley/system"]

png = ["image/png"]
jpeg = ["image/jpeg"]

markdown = ["dep:pulldown-cmark", "code_highlighting", "link"]
code_highlighting = ["dep:syntect"]
link = ["dep:open"]

default = ["vello_hybrid_renderer", "clipboard"]

[dependencies]
retgui_logging = { path = "../retgui_logger", version = "0.1.0" }
retgui_undo = {path = "../retgui_undo", version = "0.1.1"}
retgui_calendar = {path = "../retgui_calendar", version = "0.1.0"}

smol_str = "0.3.6"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
default-features = false
optional = true


[dependencies.issho]
git = "https://github.com/RetGui/issho.git"
rev = "f5decc64534ee8b8a00d81c2640387610a9f3875"

[dependencies.bitflags]
version = "2.10.0"
features = ["std"]

#[dependencies.kurbo]
#workspace = true

[dependencies.smallvec]
version = "1.15.1"
default-features = false

[dependencies.peniko]
workspace = true

[dependencies.tinyvg-rs]
workspace = true

[dependencies.rustc-hash]
version = "2.1.1"
default-features = false
features = ["std"]

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies.clipboard-rs]
version = "0.3.1"
optional = true

[dependencies.pulldown-cmark]
version = "0.13.4"
default-features = false
features = []
optional = true

[dependencies.syntect]
workspace = true
features = ["default-fancy", "parsing", "dump-load", "default-themes"]
optional = true

[dependencies.image]
workspace = true

[dependencies.gummy]
version = "0.12.1"
default-features = false
features = ["std", "gummy_tree", "flexbox", "content_size", "block_layout"]

[dependencies.chrono]
workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies.winit]
workspace = true
features = []

[target.'cfg(target_os = "android")'.dependencies.winit]
workspace = true
features = ["android-native-activity"]

[dependencies.ui-events]
git = "https://github.com/endoli/ui-events"
rev = "d2dc8ba005a21870c5e4a7221cadf08fbf5f9ae7"
features = ["kurbo"]

[dependencies.ui-events-winit]
git = "https://github.com/endoli/ui-events"
rev = "d2dc8ba005a21870c5e4a7221cadf08fbf5f9ae7"
features = []

[dependencies.parley]
version = "0.11.0"
default-features = false
features = ["std"]

[target.'cfg(target_arch = "wasm32")'.dependencies.web-time]
version = "1.1.0"
default-features = false
features = []

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2.126"
default-features = false
features = ["std", "msrv"]

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.103"
default-features = false
features = [
    "Document",
    "Window",
    "Element",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.open]
version = "5.3.3"
default-features = false
optional = true
features = []

[dependencies.retgui_primitives]
path = "../retgui_primitives"
default-features = false
version = "0.1.1"

[dependencies.retgui_renderer]
path = "../retgui_renderer"
default-features = false
version = "0.1.1"

[dependencies.retgui_runtime]
path = "../retgui_runtime"
default-features = false
version = "0.1.1"

[dependencies.retgui_resource_manager]
path = "../retgui_resource_manager"
default-features = false
version = "0.1.1"

[dependencies.maudio]
git = "https://github.com/someotherself/maudio.git"
rev = "7f9838516446e3a6350c14d1472fd2c2e881c5cf"
optional = true

[dev-dependencies]
libtest-mimic-collect  = "0.3.3"


[[test]]
name = "counter"
path = "tests/counter.rs"
harness = false
required-features = ["vello_cpu_renderer", "png"]
