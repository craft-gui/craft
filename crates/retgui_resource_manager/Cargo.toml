[package]
name = "retgui_resource_manager"
version = "0.1.1"
edition.workspace = true

[features]
http_client = ["dep:reqwest"]

[dependencies.retgui_logging]
path = "../retgui_logger"
default-features = false
version = "0.1.0"

[dependencies.retgui_runtime]
path = "../retgui_runtime"
default-features = false
version = "0.1.1"

[target.'cfg(not(target_os = "android"))'.dependencies.reqwest]
workspace = true
default-features = false
features = ["native-tls"]
optional = true

[target.'cfg(target_os = "android")'.dependencies.reqwest]
workspace = true
default-features = false
features = ["rustls"]
optional = true

[dependencies.image]
workspace = true

[dependencies.tinyvg-rs]
workspace = true

[dependencies.chrono]
workspace = true
