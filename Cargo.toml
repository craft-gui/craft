[workspace]
resolver = "2"

members = [
    "retgui",
    "calendar",
    "logger",
    "xtask",
    "examples/util",
    "examples/counter",
    "examples/custom_event",
    "examples/multiwindow",
    "examples/pointer_events",
    "examples/text",
    "examples/jsframeworkbench",
    "examples/gallery",
    "syntect_dumper",
    "renderer",
    "primitives",
    "resource_manager",
    "runtime",
    "undo",
    "website",
]

[workspace.package]
edition = "2024"

[profile.dev]
opt-level = 1

[profile.release]
# For fast build/run and profiling
debug = true

## For fast run & small binary:
#opt-level = 3
#lto = true
#codegen-units = 1
#strip = true
#debug = false

[profile.web-release]
inherits = "release"
debug = false
strip = "debuginfo"
lto = true
codegen-units = 1

[workspace.dependencies]
reqwest = { version = "0.13.4", default-features = false }
tracing = { version = "0.1.44" }
tracing-subscriber = {version = "0.3.23"}

[workspace.dependencies.windows]
version = "0.62.2"
default-features = false

[workspace.dependencies.syntect]
default-features = false
version = "5.3.0"

[workspace.dependencies.peniko]
version = "0.6.1"
default-features = false
features = ["std"]

[workspace.dependencies.kurbo]
version = "0.13.1"
default-features = false
features = ["std"]

[workspace.dependencies.dpi]
version = "0.1.2"
default-features = false
features = []

[workspace.dependencies.tokio]
version = "1.52.3"
default-features = false
features = ["sync", "time"]

[workspace.dependencies.image]
version = "0.25.10"
default-features = false
features = []

[workspace.dependencies.tinyvg-rs]
version = "0.0.2"
default-features = false
features = []

[workspace.dependencies.jiff]
version = "0.2.35"
default-features = false
features = ["default", "js"]

[workspace.dependencies.winit]
git = "https://github.com/rust-windowing/winit"
rev = "874a1e31f194d11313c1ac133b28037b99db3e19"
default-features = false
features = []
