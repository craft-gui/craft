name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: "0.5.4"
  RUST_STABLE_VER: "1.91"

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libfontconfig1-dev
      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}

      - name: Install Clippy
        run: rustup component add clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libfontconfig1-dev
      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
      - name: Build RetGui
        run: cargo build --verbose
      - name: Build Counter Example
        run: cargo build --package counter

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
      - name: Build RetGui
        run: cargo build --verbose
      - name: Build Counter Example
        run: cargo build --package counter

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
      - name: Build Counter Example
        run: cargo build --bin counter

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libfontconfig1-dev
      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: aarch64-linux-android

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config curl unzip

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 ndk;27.2.12479018'

      - name: Install cargo APK
        run: cargo install cargo-apk

      - name: Build Counter Example for Android
        run: cargo apk build --package counter --lib

  build-ios:
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: aarch64-apple-ios
      - name: Build Counter Example for iOS
        run: cargo build --package counter --target aarch64-apple-ios --bin counter

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libfontconfig1-dev
      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
      - name: Build Unit Tests
        run: cargo test --package retgui --no-run
      - name: Run Unit Tests
        run: cargo test --package retgui --no-fail-fast --verbose

  integration-tests:
    runs-on: windows-latest
    env:
      retgui_TEST: generate-all

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}

      - name: Run Integration Tests
        run: |
          cargo test -p retgui --tests --no-default-features --features integration_tests

      - name: Generate Kompari report
        if: always()
        run: cargo xtask report

      - name: Upload Kompari report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kompari-report
          path: |
            report.html
            retgui/tests/current
            retgui/tests/snapshots

  build-book:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}

      - name: Install mdBook
        run: cargo install mdbook --version ${{ env.MDBOOK_VERSION }} --locked

      - name: Build mdBook
        run: mdbook build book

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy-book:
    if: github.event_name == 'push'
    needs: build-book
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
