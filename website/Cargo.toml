[package]
name = "website"
version = "0.1.0"
edition = "2024"

[dependencies]

util = { path = "../examples/util" }

web-sys = { version = "0.3.77", features = ["Window", "Location", "History", "Event"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.retgui]
path = "../retgui"
default-features = false
features = [
    "vello_hybrid_renderer",
    "http_client",
    "png",
    "jpeg",
    "system_fonts",
    "markdown"
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.retgui]
path = "../retgui"
default-features = false
features = [
    "vello_hybrid_renderer",
    "http_client",
    "png",
    "jpeg",
    "system_fonts",
    "markdown"
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-web = "0.1.3"
console_error_panic_hook = "0.1.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
open = "5"
